<body class="bg-[#061121] bg-gradient-to-b from-[#071324] via-[#091930] to-[#050d1a] text-white font-sans antialiased min-h-screen flex items-center justify-center p-4 selection:bg-cyan-500 selection:text-white">

    <!-- Subtle Background Radial Glow -->

        <!-- Top Cyan/Blue Light Edge Highlight -->

        <!-- Circular App Logo with Concentric Glowing Rings -->
        <div class="relative mb-6 flex items-center justify-center">
            <!-- Outer Ambient Glow -->
            <div class="absolute -inset-2.5 rounded-full bg-gradient-to-tr from-blue-600 via-cyan-400 to-emerald-400 opacity-35 blur-md"></div>
            <!-- Outer Ring -->
            <div class="relative p-1.5 rounded-full bg-[#08172b] border border-cyan-400/40 shadow-[0_0_25px_rgba(14,165,233,0.45)]">
                <!-- Inner Circular Logo Frame -->
                <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full overflow-hidden border-2 border-cyan-300/70 bg-[#0b1f3a] flex items-center justify-center">
                    <img 
                        src="WhatsApp Image 2026-11-22 at 11.58.00 AM.jpg" 
                        alt="Sridevi 777 Official Logo" 
                        onerror="this.onerror=null; this.src='https://placehold.co/256x256/0a1e38/22d3ee?text=S+777';"
                        class="w-full h-full object-cover object-center"
                    />
                </div>
            </div>
        </div>

        <!-- Status Pill Badge: ANDROID APP -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-[#0b1f38] border border-sky-400/20 shadow-inner mb-5">
            <span class="w-2 h-2 rounded-full bg-[#10b981] shadow-[0_0_8px_#10b981]"></span>
            <span class="text-[11px] font-bold tracking-[0.18em] text-cyan-200 uppercase">
                ANDROID APP
            </span>
        </div>

        <!-- Dual-Tone Bold Title -->
        <h1 class="text-[32px] sm:text-[36px] font-black tracking-tight uppercase leading-none">
            <span class="text-white">SRIDEVI</span> <span class="text-[#10d494]">777</span>
        </h1>

        <!-- Subtitle -->
        <p class="mt-2.5 text-[14.5px] font-medium text-slate-300 tracking-wide">
            Official Android Application
        </p>

        <!-- Info Strip: Android APK | Direct Download -->
        <div class="w-full mt-7 py-3 px-4 rounded-xl bg-[#071324]/90 border border-sky-400/15 flex items-center justify-center gap-4 text-[13px] font-semibold text-slate-200">
            <!-- Android Phone Icon -->
            <div class="flex items-center gap-1.5">
                <svg class="w-4 h-4 text-[#10d494]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="6" y="2" width="12" height="20" rx="2.5"/>
                    <line x1="12" y1="18" x2="12.01" y2="18"/>
                </svg>
                <span>Android APK</span>
            </div>

            <!-- Vertical Divider -->
            <span class="w-[1px] h-4 bg-slate-700"></span>

            <!-- Lightning Icon -->
            <div class="flex items-center gap-1.5">
                <svg class="w-4 h-4 text-[#10d494] fill-current" viewBox="0 0 24 24">
                    <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
                </svg>
                <span>Direct Download</span>
            </div>
        </div>

        <!-- Primary Vibrant Blue CTA Button -->
        <a href="https://sridevi777.fun/apk/Sridevi%20777.apk"
           download="Sridevi 777.apk"
           onclick="handleDownloadToast()"

            <svg class="w-6 h-6 text-white transition-transform duration-200 group-hover:translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v12"/>
                <path d="m7 10 5 5 5-5"/>
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
            <span class="text-white font-extrabold text-[17px] tracking-wider uppercase">
                DOWNLOAD APK
            </span>
        </a>

        <!-- Lock Security Caption -->
        <div class="mt-6 flex items-center justify-center gap-1.5 text-[11px] font-bold tracking-[0.16em] text-slate-400 uppercase">
            <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7z"/>
            </svg>

        <!-- Bottom Installation Instruction Text -->
        <p class="mt-2.5 text-[12.5px] text-slate-400 leading-relaxed max-w-[330px]">
            Download the APK, open the file on your Android device, and follow the installation prompts.
        </p>

    </main>

    <!-- Custom Toast Notification -->
    <div id="download-toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-[#0c213d] border border-cyan-400/50 text-white px-4 py-2.5 rounded-xl shadow-[0_8px_30px_rgba(14,165,233,0.4)] flex items-center gap-2.5 text-sm font-medium">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
        <span>Sridevi 777 APK downloading...</span>
    </div>

    <script>
        function handleDownloadToast() {
            const toast = document.getElementById('download-toast');
            if (!toast) return;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
